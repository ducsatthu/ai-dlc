<!-- @dsCard group="Colors" viewport="700x130" name="Neutrals — dark (default for the app)" subtitle="Ops console runs dark; documents run light" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;font-family:var(--sans)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:96px}.chipbox{height:52px;border-radius:var(--radius-md);border:1px solid var(--line)}.n{font-family:var(--mono);font-size:11px;color:var(--ink);margin-top:6px;display:block}.v{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block}.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="g">
<div class="sw"><div class="chipbox" style="background:#0E1419"></div><span class="n">--bg</span><span class="v">#0E1419</span></div><div class="sw"><div class="chipbox" style="background:#161D24"></div><span class="n">--surface</span><span class="v">#161D24</span></div><div class="sw"><div class="chipbox" style="background:#1D262F"></div><span class="n">--surface-2</span><span class="v">#1D262F</span></div><div class="sw"><div class="chipbox" style="background:#2A3540"></div><span class="n">--line</span><span class="v">#2A3540</span></div><div class="sw"><div class="chipbox" style="background:#93A1AE"></div><span class="n">--muted</span><span class="v">#93A1AE</span></div><div class="sw"><div class="chipbox" style="background:#E6ECF2"></div><span class="n">--ink</span><span class="v">#E6ECF2</span></div>
</div></body></html>
