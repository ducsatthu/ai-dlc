<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;font-family:var(--sans)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:96px}.chipbox{height:52px;border-radius:var(--radius-md);border:1px solid var(--line)}.n{font-family:var(--mono);font-size:11px;color:var(--ink);margin-top:6px;display:block}.v{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block}.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:12px;font-family:var(--mono);font-size:11px;color:var(--muted)">
<div><div style="border-top:1px solid var(--line);margin-bottom:4px"></div>1px var(--line) — row separators, panel edges</div>
<div><div style="border-top:1.5px solid var(--accent);margin-bottom:4px"></div>1.5px var(--accent) — gate stop block</div>
<div><div style="border-top:2px solid var(--ink);margin-bottom:4px"></div>2px var(--ink) — masthead + table head rule</div>
<div><div style="border-left:3px solid var(--blue);padding-left:10px">3px var(--blue) — callout left rule (only left-border pattern in the system)</div></div>
</div></body></html>
