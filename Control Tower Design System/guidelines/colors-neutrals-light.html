<div class="sw"><div class="chipbox" style="background:#F2F4F6"></div><span class="n">--bg</span><span class="v">#F2F4F6</span></div><div class="sw"><div class="chipbox" style="background:#FFFFFF"></div><span class="n">--surface</span><span class="v">#FFFFFF</span></div><div class="sw"><div class="chipbox" style="background:#E9EDF1"></div><span class="n">--surface-2</span><span class="v">#E9EDF1</span></div><div class="sw"><div class="chipbox" style="background:#CFD7DE"></div><span class="n">--line</span><span class="v">#CFD7DE</span></div><div class="sw"><div class="chipbox" style="background:#5B6874"></div><span class="n">--muted</span><span class="v">#5B6874</span></div><div class="sw"><div class="chipbox" style="background:#18222C"></div><span class="n">--ink</span><span class="v">#18222C</span></div>
</div></body></html>
