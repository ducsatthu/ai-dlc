<!-- @dsCard group="Colors" viewport="700x150" name="Status semantics" subtitle="Amber = needs a human · blue = agent activity · green = done" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;font-family:var(--sans)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:96px}.chipbox{height:52px;border-radius:var(--radius-md);border:1px solid var(--line)}.n{font-family:var(--mono);font-size:11px;color:var(--ink);margin-top:6px;display:block}.v{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block}.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="g">
<div class="sw" style="min-width:120px"><div class="chipbox" style="background:#B96E00"></div><span class="n">--accent / --status-gate</span><span class="v">#B96E00</span><span class="v">cần con người quyết</span></div><div class="sw" style="min-width:120px"><div class="chipbox" style="background:#33689E"></div><span class="n">--blue / --status-agent</span><span class="v">#33689E</span><span class="v">agent + review</span></div><div class="sw" style="min-width:120px"><div class="chipbox" style="background:#2E7D4F"></div><span class="n">--ok / --status-done</span><span class="v">#2E7D4F</span><span class="v">done · approved</span></div><div class="sw" style="min-width:120px"><div class="chipbox" style="background:#5B6874"></div><span class="n">--muted / --status-pending</span><span class="v">#5B6874</span><span class="v">pending</span></div><div class="sw" style="min-width:120px"><div class="chipbox" style="background:#A83B2B"></div><span class="n">--danger</span><span class="v">#A83B2B</span><span class="v">blocked (derived)</span></div>
</div></body></html>
