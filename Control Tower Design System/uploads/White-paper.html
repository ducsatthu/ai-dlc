document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"03a60a13-2b90-49b2-a360-29e74ea5694a\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"55c05558-c10d-41d4-877b-b24b769ad3e5\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"184c45f3-ba5a-479f-8803-4f2bf995b2e7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; font-family: 'Be Vietnam Pro', system-ui, sans-serif; }\n  doc-page:not(:defined) { visibility: hidden; }\n  p { margin: 0 0 10px; orphans: 3; widows: 3; }\n  a { color: #1a56c4; text-decoration: none; border-bottom: 1px solid #c6d4f2; }\n  a:hover { color: #A142F4; border-bottom-color: #A142F4; }\n  sup { font-size: 9px; line-height: 0; }\n<\u002Fstyle>\n<script src=\"a1e032b4-4f87-4242-95ac-f88abbcdf3ff\"><\u002Fscript>\n<\u002Fhelmet>\n\n<doc-page size=\"a4\" margin=\"0.35in\">\n\n<div slot=\"footer\" style=\"display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #DADCE0; padding-top: 8px; font-size: 9.5px; color: #5F6368; font-family: 'Be Vietnam Pro', sans-serif\">\n  <span>AI-DLC · Định nghĩa phương pháp · Bản dịch nội bộ Mynavi TechTus Vietnam<\u002Fspan>\n  <span>Nguồn: Raja SP, Amazon Web Services<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"position: relative; overflow: hidden; border: 1px solid #DADCE0; color: #202124; border-radius: 24px; padding: 26px 26px 22px; break-inside: avoid; background-color: #FFFFFF00; border-width: 0px\">\n  <div style=\"position: absolute; top: -80px; right: -70px; width: 360px; height: 340px; background: linear-gradient(118deg, #00E0FF 0%, #2C6BFF 28%, #7B2FF7 58%, #FF3DCB 100%); border-radius: 62% 38% 55% 45%/48% 62% 38% 52%; transform: rotate(-16deg); -webkit-mask-image: radial-gradient(circle, #000 1.45px, transparent 1.6px), radial-gradient(115% 115% at 74% 16%, #000 40%, rgba(0,0,0,0.55) 66%, transparent 90%); -webkit-mask-size: 4.2px 4.2px, 100% 100%; -webkit-mask-composite: source-in; mask-image: radial-gradient(circle, #000 1.45px, transparent 1.6px), radial-gradient(115% 115% at 74% 16%, #000 40%, rgba(0,0,0,0.55) 66%, transparent 90%); mask-size: 4.2px 4.2px, 100% 100%; mask-composite: intersect\"><\u002Fdiv>\n  <div style=\"position: relative; font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: #5F6368\">WHITE PAPER · SOFTWARE ENGINEERING METHODS<\u002Fdiv>\n\n  <h1 style=\"position: relative; font-size: 43px; font-weight: 400; line-height: 0.96; letter-spacing: -0.03em; margin: 28px 0 0; max-width: 60ch; text-wrap: pretty; width: 505px; height: 84px\"><b>AI-DLC: vòng đời phát triển phần mềm do AI dẫn dắt.<\u002Fb><\u002Fh1>\n\n  <div style=\"position: relative; margin-top: 18px; font-size: 17px; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; color: #5F6368; max-width: 44ch\">Định nghĩa phương pháp AI-Driven Development Lifecycle (AI-DLC) — một phương pháp AI-native được tái hình dung \"First Principles Thinking\"<\u002Fdiv>\n\n  <div style=\"position: relative; margin-top: 24px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center\">\n    <span style=\"display: inline-flex; align-items: center; gap: 7px; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 999px; padding: 5px 13px; font-size: 10.5px\"><span style=\"width: 6px; height: 6px; border-radius: 999px; background: #4285F4\"><\u002Fspan>Raja SP, Amazon Web Services<\u002Fspan>\n    <span style=\"display: inline-flex; align-items: center; gap: 7px; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 999px; padding: 5px 13px; font-size: 10.5px\"><span style=\"width: 6px; height: 6px; border-radius: 999px; background: #34A853\"><\u002Fspan>Bản dịch nội bộ Mynavi TechTus Vietnam<\u002Fspan>\n    <span style=\"display: inline-flex; align-items: center; gap: 7px; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 999px; padding: 5px 13px; font-size: 10.5px\"><span style=\"width: 6px; height: 6px; border-radius: 999px; background: rgb(251, 188, 4);\"><\u002Fspan>Dành cho Engineers, APM &amp; Delivery<\u002Fspan><img src=\"ac1b1d09-5468-45a5-befc-d488c8f79b3e\" alt=\"Mynavi TechTus Vietnam\" style=\"height: 43px; width: 111px; display: block; margin-left: auto\">\n    \n  <\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top: 16px; background: #E8EAED; border-radius: 20px; padding: 16px 20px; break-inside: avoid\">\n  <div style=\"font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: #5F6368\">Về bản dịch này<\u002Fdiv>\n  <div style=\"margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 26px; font-size: 12.5px; line-height: 1.55; color: #202124\">\n    <div style=\"border-left: 2px solid #202124; padding-left: 12px\">Nội dung giữ nguyên cấu trúc và ý của bản gốc tiếng Anh. Các thuật ngữ phương pháp (Intent, Unit, Bolt, Mob Elaboration…) giữ nguyên tiếng Anh, kèm chú giải tiếng Việt ở lần xuất hiện đầu.<\u002Fdiv>\n    <div style=\"border-left: 2px solid #202124; padding-left: 12px\">Bản white paper đã được viết lại so với bản tiếng Anh giữ nguyên các nguyên tắc cốt lõi, giữ bối cảnh, các principal và method.<br>Ngôn ngữ và thể hiện phù hợp với Mynavi Techtus<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 24px; align-items: start; break-inside: avoid\">\n  <div>\n    <div style=\"font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: #5F6368\">TÓM TẮT BỐI CẢNH<\u002Fdiv>\n    <h2 style=\"font-size: 30px; font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; margin: 10px 0 14px; text-wrap: pretty\">AI không nên được thêm vá vào quy trình cũ. Quy trình nên được vẽ lại quanh AI.<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column; gap: 7px; font-size: 13px; line-height: 1.55\">\n      <div style=\"border-left: 2px solid #4285F4; padding-left: 13px\"><b style=\"font-weight: 500\">Đảo chiều hội thoại.<\u002Fb> AI khởi xướng và dẫn dắt, đề xuất kế hoạch cùng các phương án đánh đổi; con người phê duyệt, xác nhận và chốt quyết định tại các điểm then chốt.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 13px\"><b style=\"font-weight: 500\">Ba pha, không hơn.<\u002Fb> Inception, Construction, Operations — số pha tối thiểu nhưng đủ để con người giám sát ở các điểm quyết định.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #34A853; padding-left: 13px\"><b style=\"font-weight: 500\">Vòng lặp tính bằng giờ hoặc ngày.<\u002Fb> Sprint được đổi tên thành Bolt để phản ánh chu kỳ xây dựng - xác nhận ngắn hơn hàng chục lần.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #FBBC04; padding-left: 13px\"><b style=\"font-weight: 500\">Kỹ thuật thiết kế nằm trong lõi.<\u002Fb> Khác Scrum hay Kanban, AI-DLC không để Domain-Driven Design ra ngoài phạm vi mà đưa vào trung tâm phương pháp.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #EA4335; padding-left: 13px\"><b style=\"font-weight: 500\">Xác nhận của con người là hàm mất mát.<\u002Fb> Mỗi lần con người rà soát sẽ cắt bỏ nỗ lực sai hướng trước khi nó lan xuống hạ nguồn.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background: #E8EAED; border-radius: 20px; padding: 18px 20px\">\n    <div style=\"font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: #5F6368\">Phạm vi áp dụng<\u002Fdiv>\n    <div style=\"margin-top: 12px; font-size: 12.5px; line-height: 1.6; color: #202124\">AI-DLC hướng đến hệ thống phức tạp: thay đổi chức năng liên tục, kiến trúc nhiều tầng, nhiều phương án đánh đổi, yêu cầu về mở rộng, tích hợp và tùy biến, thường có nhiều nhóm trong tổ chức lớn hoặc chịu quy định.<\u002Fdiv>\n    <div style=\"margin-top: 14px; padding-top: 14px; border-top: 1px solid #BDC1C6; font-size: 12.5px; line-height: 1.6; color: #5F6368\">Hệ thống đơn giản, ít hoặc không cần quản lý đánh đổi, có thể do người không phải lập trình viên xây dựng, nằm ngoài phạm vi AI-DLC và phù hợp hơn với low-code/no-code.<\u002Fdiv>\n    <div style=\"margin-top: 16px; display: flex; flex-direction: column; gap: 5px\">\n      <div style=\"font-size: 11px; color: #5F6368\">Nội dung tài liệu<\u002Fdiv>\n      <div style=\"font-size: 12px; line-height: 1.5\">I. Bối cảnh · II. Mười nguyên tắc cốt lõi · III. Framework cốt lõi · IV. Green-field · V. Brown-field · VI. Áp dụng · Thuật ngữ · Phụ lục A: bộ prompt<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"break-after: avoid; font-size: 32px; font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; margin: 22px 0 4px\">I. Bối cảnh<\u002Fh2>\n<div style=\"height: 2px; background: #202124; width: 64px; margin-bottom: 14px\"><\u002Fdiv>\n<div style=\"column-count: 2; column-gap: 30px; font-size: 13.5px; line-height: 1.62; text-wrap: pretty\">\n  <p>Sự phát triển của công nghệ phần mềm là một hành trình liên tục nhằm giúp lập trình viên tập trung giải quyết các vấn đề phức tạp bằng cách trừu tượng hóa những công việc cấp thấp, không tạo khác biệt. Từ mã máy ban đầu đến ngôn ngữ lập trình cấp cao, rồi việc áp dụng API và thư viện, mỗi bước đều làm năng suất của lập trình viên tăng đáng kể. Ngày nay, sự tích hợp của các Mô hình Ngôn ngữ Lớn (LLM) đã cách mạng hóa cách phần mềm được tạo ra, đưa tương tác hội thoại bằng ngôn ngữ tự nhiên vào các công việc như sinh mã, phát hiện lỗi và tạo kiểm thử. Đây là kỷ nguyên AI-Assisted (AI hỗ trợ), nơi AI tăng cường cho từng nhiệm vụ cụ thể, chi tiết.<\u002Fp>\n  <p>Khi AI tiếp tục phát triển, phạm vi ứng dụng của nó đang mở rộng ra ngoài việc sinh mã để bao gồm làm rõ yêu cầu, lập kế hoạch, phân rã nhiệm vụ, thiết kế và cộng tác thời gian thực với lập trình viên. Sự chuyển dịch này đang khởi đầu kỷ nguyên AI-Driven (AI dẫn dắt), nơi AI chủ động điều phối quá trình phát triển. Tuy nhiên, các phương pháp phát triển phần mềm hiện có được thiết kế cho quy trình kéo dài và do con người dẫn dắt nên chưa hoàn toàn phù hợp với tốc độ, tính linh hoạt và năng lực nâng cao của AI, ví dụ năng lực tác tử (agentic). Việc phụ thuộc vào workflow thủ công và định nghĩa vai trò cứng nhắc làm hạn chế khả năng khai thác trọn vẹn AI.<\u002Fp>\n  <p>Chắp AI vào các phương pháp này không chỉ giới hạn tiềm năng của nó mà còn củng cố những bất cập lỗi thời. Để tận dụng đầy đủ sức mạnh biến đổi của AI, các phương pháp SDLC cần được tái hình dung. Điều đó đòi hỏi AI trở thành cộng tác viên trung tâm, đồng bộ workflow, vai trò và vòng lặp để ra quyết định nhanh hơn, thực thi nhiệm vụ liền mạch và thích ứng liên tục.<\u002Fp>\n  <p style=\"margin-bottom: 0\">Tài liệu này giới thiệu và định nghĩa <b style=\"font-weight: 500\">AI-Driven Development Lifecycle (AI-DLC)<\u002Fb>, một phương pháp AI-native được tái hình dung để tích hợp đầy đủ năng lực AI, đặt nền móng cho bước tiến tiếp theo của kỹ nghệ phần mềm.<\u002Fp>\n<\u002Fdiv>\n\n<h2 style=\"break-after: avoid; font-size: 32px; font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; margin: 22px 0 4px\">II. Mười nguyên tắc cốt lõi<\u002Fh2>\n<div style=\"height: 2px; background: #202124; width: 64px; margin-bottom: 12px\"><\u002Fdiv>\n<div style=\"font-size: 13.5px; line-height: 1.62; color: #5F6368; max-width: 62ch; margin-bottom: 14px\">Các nguyên tắc trong phần này là nền tảng để định nghĩa AI-DLC, định hình các pha, vai trò, artefact và nghi thức. Những giả định này rất quan trọng đối với việc kiểm chứng phương pháp được đề xuất, vì chúng cung cấp lý do nền tảng cho thiết kế của phương pháp.<\u002Fdiv>\n\n<div style=\"column-count: 2; column-gap: 30px; font-size: 13.5px; line-height: 1.62; text-wrap: pretty\">\n  <div style=\"break-inside: avoid; margin-bottom: 18px\">\n    <h3 style=\"font-size: 15px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; display: flex; align-items: flex-start; gap: 9px; break-after: avoid; break-inside: avoid\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 7px; background: #202124; color: #F8F9FA; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px\">1<\u002Fspan><span style=\"border-bottom: 2px solid #FBBC04; padding-bottom: 1px\">Tái hình dung thay vì chắp vá<\u002Fspan><\u002Fh3>\n  <p>Chúng tôi chọn tái hình dung một phương pháp phát triển thay vì giữ các phương pháp hiện có như SDLC hay Agile, ví dụ Scrum, rồi đưa AI vào. Các phương pháp truyền thống này được thiết kế cho những vòng lặp dài theo tháng hoặc tuần, dẫn đến các nghi thức như họp đứng hằng ngày và retrospective. Ngược lại, áp dụng AI đúng cách tạo ra các chu kỳ nhanh, đo bằng giờ hoặc ngày. Điều này cần cơ chế xác nhận và phản hồi liên tục theo thời gian thực, khiến nhiều nghi thức truyền thống bớt phù hợp.<\u002Fp>\n  <p>Việc ước lượng công sức, ví dụ story point, còn quan trọng đến đâu nếu AI làm mờ ranh giới giữa việc đơn giản, trung bình và khó? Chỉ số như velocity còn phù hợp không, hay nên thay bằng Business Value (giá trị kinh doanh)? AI cũng ngày càng tự động hóa các thực hành thủ công như lập kế hoạch, phân rã nhiệm vụ, phân tích yêu cầu và áp dụng kỹ thuật thiết kế, ví dụ mô hình hóa miền, từ đó rút ngắn số pha từ ý định đến mã. Những động lực mới này đòi hỏi tái hình dung dựa trên tư duy nguyên lý đầu tiên thay vì chắp vá. Chúng ta cần ô tô, không phải xe ngựa chạy nhanh hơn.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px\">\n    <h3 style=\"font-size: 15px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; display: flex; align-items: flex-start; gap: 9px; break-after: avoid; break-inside: avoid\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 7px; background: #202124; color: #F8F9FA; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px\">2<\u002Fspan><span style=\"border-bottom: 2px solid #FBBC04; padding-bottom: 1px\">Đảo chiều hướng hội thoại<\u002Fspan><\u002Fh3>\n  <p>AI-DLC tạo ra thay đổi căn bản: AI khởi xướng và dẫn dắt hội thoại với con người, thay vì con người khởi xướng hội thoại với AI để hoàn thành nhiệm vụ. AI dẫn dắt workflow bằng cách phân rã các Intent cấp cao, ví dụ triển khai một chức năng kinh doanh mới, thành các nhiệm vụ có thể hành động; tạo khuyến nghị; và đề xuất các phương án đánh đổi. Con người đóng vai trò phê duyệt, xác nhận, lựa chọn phương án và chốt quyết định tại các điểm then chốt.<\u002Fp>\n  <p>Cách tiếp cận do AI dẫn dắt giúp lập trình viên tập trung vào quyết định có giá trị cao, trong khi AI xử lý lập kế hoạch, phân rã nhiệm vụ và tự động hóa. Bằng cách đảo ngược động lực truyền thống, AI-DLC bảo đảm sự tham gia của con người có mục đích, tập trung vào giám sát, giảm thiểu rủi ro và đồng bộ chiến lược, qua đó nâng cả tốc độ lẫn chất lượng. Có thể hình dung như Google Maps: con người đặt đích đến, tức Intent, còn hệ thống đưa ra chỉ dẫn từng bước, tức sự phân rã nhiệm vụ và khuyến nghị của AI. Trên đường đi, con người vẫn giám sát và điều chỉnh hành trình khi cần.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px\">\n    <h3 style=\"font-size: 15px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; display: flex; align-items: flex-start; gap: 9px; break-after: avoid; break-inside: avoid\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 7px; background: #202124; color: #F8F9FA; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px\">3<\u002Fspan><span style=\"border-bottom: 2px solid #FBBC04; padding-bottom: 1px\">Tích hợp kỹ thuật thiết kế vào lõi<\u002Fspan><\u002Fh3>\n  <p>Các framework Agile như Scrum hay Kanban để kỹ thuật thiết kế, ví dụ Domain-Driven Design, ngoài phạm vi và khuyến nghị nhóm tự lựa chọn. Khoảng trống quan trọng này đã góp phần làm chất lượng phần mềm suy giảm. Riêng tại Hoa Kỳ, các vấn đề chất lượng phần mềm được ước tính gây thiệt hại 2,41 nghìn tỷ USD vào năm 2022.<sup>1<\u002Fsup><\u002Fp>\n  <p>Thay vì tách kỹ thuật thiết kế ra ngoài, AI-DLC đưa chúng vào lõi. AI-DLC sẽ có các biến thể cho nhóm theo Domain-Driven Design (DDD), Behavior-Driven Development (BDD) hoặc Test-Driven Development (TDD). Tài liệu này trình bày biến thể DDD của AI-DLC, sử dụng các nguyên tắc DDD để chia hệ thống thành những bounded context (miền ngữ cảnh có biên rõ ràng) độc lập, đúng kích thước và có thể được xây dựng nhanh theo hướng song song. AI sẽ tự áp dụng các kỹ thuật này trong lúc lập kế hoạch và phân rã nhiệm vụ; lập trình viên chỉ cần xác nhận và điều chỉnh. Việc tích hợp này là chìa khóa cho vòng lặp theo giờ hoặc ngày, đồng thời loại bỏ phần việc thủ công nặng nề và duy trì chất lượng phần mềm, với phương châm \"Xây hệ thống tốt hơn, nhanh hơn\".<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px\">\n    <h3 style=\"font-size: 15px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; display: flex; align-items: flex-start; gap: 9px; break-after: avoid; break-inside: avoid\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 7px; background: #202124; color: #F8F9FA; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px\">4<\u002Fspan><span style=\"border-bottom: 2px solid #FBBC04; padding-bottom: 1px\">Phù hợp với năng lực AI hiện tại<\u002Fspan><\u002Fh3>\n  <p>Tài liệu này lạc quan về tiềm năng tương lai của AI nhưng hoàn toàn thực tế về trạng thái hiện tại. AI-DLC thừa nhận AI đang tiến bộ nhưng chưa đủ tin cậy để tự chuyển ý định cấp cao thành mã thực thi hoặc vận hành độc lập mà không có sự giám sát của con người, trong khi vẫn bảo đảm khả năng giải thích và an toàn. Đồng thời, mô hình AI-Assisted, nơi lập trình viên làm phần lớn công việc trí tuệ nặng và AI chỉ tăng cường, không khai mở hết tiềm năng của AI trong phát triển.<\u002Fp>\n  <p>AI-DLC áp dụng mô hình AI-Driven để cân bằng sự tham gia của con người với năng lực và giới hạn của AI hiện tại. Trong đó, lập trình viên vẫn chịu trách nhiệm cuối cùng về xác nhận, ra quyết định và giám sát. Sự cân bằng này giúp tận dụng hiệu quả thế mạnh của AI mà không làm suy yếu các lớp bảo vệ quan trọng từ phán đoán của lập trình viên.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px\">\n    <h3 style=\"font-size: 15px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; display: flex; align-items: flex-start; gap: 9px; break-after: avoid; break-inside: avoid\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 7px; background: #202124; color: #F8F9FA; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px\">5<\u002Fspan><span style=\"border-bottom: 2px solid #FBBC04; padding-bottom: 1px\">Phục vụ việc xây dựng hệ thống phức tạp<\u002Fspan><\u002Fh3>\n  <p>AI-DLC hướng đến các hệ thống cần thích ứng chức năng liên tục, có độ phức tạp kiến trúc cao, phải quản lý nhiều phương án đánh đổi, yêu cầu mở rộng, tích hợp và tùy biến. Những hệ thống này cần kỹ thuật thiết kế nâng cao, mẫu thiết kế và thực hành tốt, thường có nhiều nhóm phối hợp trong tổ chức lớn hoặc chịu quy định. Các hệ thống đơn giản có thể do người không phải lập trình viên xây dựng, ít hoặc không cần quản lý đánh đổi, nằm ngoài phạm vi AI-DLC và phù hợp hơn với cách tiếp cận low-code/no-code.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px\">\n    <h3 style=\"font-size: 15px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; display: flex; align-items: flex-start; gap: 9px; break-after: avoid; break-inside: avoid\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 7px; background: #202124; color: #F8F9FA; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px\">6<\u002Fspan><span style=\"border-bottom: 2px solid #FBBC04; padding-bottom: 1px\">Giữ lại những gì tăng cộng sinh người - AI<\u002Fspan><\u002Fh3>\n  <p>Khi tái hình dung phương pháp, chúng tôi giữ lại các artefact và điểm tiếp xúc của phương pháp hiện có nếu chúng thiết yếu cho xác nhận của con người và giảm thiểu rủi ro. Ví dụ, user story đồng bộ cách hiểu của con người và AI về thứ cần xây dựng, hoạt động như những hợp đồng rõ ràng. User story vì vậy tiếp tục được giữ trong phương pháp mới. Một ví dụ khác là Risk Register (sổ đăng ký rủi ro của tổ chức), bảo đảm kế hoạch và mã do AI tạo tuân thủ framework quản trị rủi ro. Các thành phần được giữ lại sẽ được tối ưu cho sử dụng thời gian thực, cho phép lặp nhanh mà không đánh đổi sự đồng bộ hoặc an toàn.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px\">\n    <h3 style=\"font-size: 15px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; display: flex; align-items: flex-start; gap: 9px; break-after: avoid; break-inside: avoid\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 7px; background: #202124; color: #F8F9FA; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px\">7<\u002Fspan><span style=\"border-bottom: 2px solid #FBBC04; padding-bottom: 1px\">Hỗ trợ chuyển đổi bằng sự quen thuộc<\u002Fspan><\u002Fh3>\n  <p>Phương pháp mới không nên đòi hỏi đào tạo dài ngày; người đã có kinh nghiệm phải có thể định hướng và bắt đầu thực hành trong một ngày. Để dễ áp dụng thông qua học liên tưởng, AI-DLC giữ quan hệ nền tảng giữa các thuật ngữ quen thuộc của phương pháp cũ, đồng thời đưa ra thuật ngữ hiện đại. Ví dụ, Sprint trong Scrum là chu kỳ lặp để xây dựng và xác nhận. Nhưng ở thời kỳ trước AI, Sprint thường kéo dài 4 đến 6 tuần. Với AI-DLC, chu kỳ lặp diễn ra liên tục theo giờ hoặc ngày. Vì vậy cần chủ ý đổi tên Sprint. AI-DLC gọi Sprint là <b style=\"font-weight: 500\">Bolt<\u002Fb>, nhấn mạnh chu kỳ nhanh, tập trung cao độ và tạo ra tốc độ chưa từng có.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px\">\n    <h3 style=\"font-size: 15px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; display: flex; align-items: flex-start; gap: 9px; break-after: avoid; break-inside: avoid\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 7px; background: #202124; color: #F8F9FA; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px\">8<\u002Fspan><span style=\"border-bottom: 2px solid #FBBC04; padding-bottom: 1px\">Tinh gọn trách nhiệm để tăng hiệu quả<\u002Fspan><\u002Fh3>\n  <p>Bằng cách tận dụng khả năng phân rã nhiệm vụ và hỗ trợ quyết định của AI, lập trình viên có thể vượt qua các silo chuyên môn truyền thống như hạ tầng, frontend, backend, DevOps và bảo mật. Sự hội tụ trách nhiệm làm giảm nhu cầu có nhiều vai trò chuyên biệt và tinh gọn quá trình phát triển. Tuy nhiên, Product Owner và lập trình viên vẫn là thành phần cốt lõi của framework, giữ trách nhiệm quan trọng về giám sát, xác nhận và quyết định chiến lược. Các vai trò này bảo đảm đồng bộ với mục tiêu kinh doanh, duy trì chất lượng thiết kế và tuân thủ framework quản trị rủi ro, qua đó cân bằng tự động hóa với trách nhiệm của con người. Khi định nghĩa phương pháp, chúng tôi bám vào nguyên lý đầu tiên, giữ số vai trò ở mức tối thiểu và chỉ thêm vai trò khi thực sự cần thiết.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px\">\n    <h3 style=\"font-size: 15px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; display: flex; align-items: flex-start; gap: 9px; break-after: avoid; break-inside: avoid\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 7px; background: #202124; color: #F8F9FA; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px\">9<\u002Fspan><span style=\"border-bottom: 2px solid #FBBC04; padding-bottom: 1px\">Giảm thiểu giai đoạn, tối đa hóa dòng chảy<\u002Fspan><\u002Fh3>\n  <p>Thông qua tự động hóa và hội tụ trách nhiệm, AI-DLC muốn giảm handoff và chuyển giao, tạo ra dòng lặp liên tục. Tuy vậy, việc xác nhận và ra quyết định của con người vẫn rất quan trọng để mã do AI tạo không trở nên cứng nhắc như \"xi măng đông nhanh\" (quick-cement), mà vẫn thích ứng được với các vòng lặp tương lai. Vì vậy, AI-DLC chỉ dùng số pha tối thiểu nhưng đủ để con người giám sát tại các điểm quyết định then chốt. Những lần xác nhận này hoạt động như một hàm mất mát (loss function): phát hiện và cắt bỏ nỗ lực lãng phí ở hạ nguồn trước khi chúng xảy ra.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px\">\n    <h3 style=\"font-size: 15px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; display: flex; align-items: flex-start; gap: 9px; break-after: avoid; break-inside: avoid\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 7px; background: #202124; color: #F8F9FA; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px\">10<\u002Fspan><span style=\"border-bottom: 2px solid #FBBC04; padding-bottom: 1px\">Không đóng đinh workflow SDLC cứng nhắc<\u002Fspan><\u002Fh3>\n  <p>AI-DLC không quy định workflow mang tính áp đặt cho từng con đường phát triển, như xây hệ thống mới, refactor, sửa lỗi hay mở rộng microservice. Thay vào đó, AI-DLC áp dụng cách tiếp cận AI-First thực sự: AI đề xuất Kế hoạch Cấp 1 (Level 1 Plan) dựa trên ý định của con đường đã chọn. Con người xác minh và điều chỉnh kế hoạch do AI tạo thông qua hội thoại tương tác với AI; quá trình tiếp tục ở Cấp 2, tức các nhiệm vụ con, và các cấp tiếp theo. Ở mức thực thi, AI triển khai nhiệm vụ còn con người duy trì giám sát bằng cách kiểm chứng và xác nhận kết quả. Cách tiếp cận linh hoạt này bảo đảm phương pháp có thể thích ứng và phát triển cùng năng lực AI, trong khi vẫn duy trì quyền kiểm soát của con người đối với các quyết định quan trọng.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<figure style=\"margin: 22px 0 0; break-inside: avoid\">\n  <div style=\"background: #F8F9FA; border: 1px solid #DADCE0; border-radius: 22px; padding: 20px 22px; max-width: 660px; margin: 0 auto\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n      <div style=\"font-size: 19px; font-weight: 400; letter-spacing: -0.02em\">Bản đồ AI-DLC<\u002Fdiv>\n      <div style=\"font-size: 10px; color: #5F6368; letter-spacing: 0.08em; text-transform: uppercase\">Hình 1 · Vai trò &amp; nghi thức / Pha / Artefact<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 14px; display: grid; grid-template-columns: 124px 1fr 134px; gap: 12px; font-size: 9.5px; color: #5F6368; letter-spacing: 0.07em; text-transform: uppercase\">\n      <div>Vai trò / Nghi thức<\u002Fdiv>\n      <div>Dòng chảy công việc<\u002Fdiv>\n      <div>Artefact<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 8px; display: grid; grid-template-columns: 124px 1fr 134px; gap: 12px; align-items: start\">\n      <div>\n        <div style=\"font-size: 15px; letter-spacing: -0.02em; color: #1a56c4\">Inception<\u002Fdiv>\n        <div style=\"margin-top: 5px; font-size: 10.5px; line-height: 1.45; color: #5F6368\">Product Owner, Developers, QA, AI<\u002Fdiv>\n        <div style=\"display: inline-block; margin-top: 6px; background: #FFFFFF; border: 1px solid #4285F4; color: #1a56c4; border-radius: 999px; padding: 3px 10px; font-size: 9.5px; font-weight: 500\">Mob Elaboration<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1.5px dashed #9AA0A6; border-radius: 16px; padding: 12px\">\n        <div style=\"display: flex; justify-content: center\">\n          <div style=\"background: #202124; color: #F8F9FA; border-radius: 10px; padding: 7px 22px; font-size: 12px\">Intent<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; margin: 5px 0\"><div style=\"width: 1.5px; height: 14px; background: #202124\"><\u002Fdiv><div style=\"width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #202124\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px\">\n          <div style=\"border-radius: 10px; overflow: hidden; border: 1px solid #1a73e8\"><div style=\"background: #1a73e8; color: #FFFFFF; padding: 7px 10px; font-size: 11px\">Unit 1<\u002Fdiv><div style=\"background: #4d94f8; color: #FFFFFF; padding: 4px 10px; font-size: 9px\">Mob xác nhận<\u002Fdiv><\u002Fdiv>\n          <div style=\"border-radius: 10px; overflow: hidden; border: 1px solid #1a73e8\"><div style=\"background: #1a73e8; color: #FFFFFF; padding: 7px 10px; font-size: 11px\">Unit 2<\u002Fdiv><div style=\"background: #4d94f8; color: #FFFFFF; padding: 4px 10px; font-size: 9px\">Mob xác nhận<\u002Fdiv><\u002Fdiv>\n          <div style=\"border-radius: 10px; overflow: hidden; border: 1px solid #1a73e8\"><div style=\"background: #1a73e8; color: #FFFFFF; padding: 7px 10px; font-size: 11px\">Unit n<\u002Fdiv><div style=\"background: #4d94f8; color: #FFFFFF; padding: 4px 10px; font-size: 9px\">Mob xác nhận<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; line-height: 1.4\">\n        <div style=\"border-left: 2px solid #4285F4; padding-left: 9px\">PR-FAQ<\u002Fdiv>\n        <div style=\"border-left: 2px solid #4285F4; padding-left: 9px\">User Stories<\u002Fdiv>\n        <div style=\"border-left: 2px solid #4285F4; padding-left: 9px\">NFR<\u002Fdiv>\n        <div style=\"border-left: 2px solid #4285F4; padding-left: 9px\">Rủi ro<\u002Fdiv>\n        <div style=\"border-left: 2px solid #4285F4; padding-left: 9px\">Bolt đề xuất<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 124px 1fr 134px; gap: 12px\"><div><\u002Fdiv><div><div style=\"display: flex; flex-direction: column; align-items: center; margin: 5px 0\"><div style=\"width: 1.5px; height: 14px; background: #202124\"><\u002Fdiv><div style=\"width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #202124\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 124px 1fr 134px; gap: 12px; align-items: start\">\n      <div>\n        <div style=\"font-size: 15px; letter-spacing: -0.02em; color: #7627c9\">Construction<\u002Fdiv>\n        <div style=\"margin-top: 5px; font-size: 10.5px; line-height: 1.45; color: #5F6368\">Developers, AI · Product Owner khi cần<\u002Fdiv>\n        <div style=\"margin-top: 6px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start\">\n          <div style=\"background: #FFFFFF; border: 1px solid #A142F4; color: #7627c9; border-radius: 999px; padding: 3px 10px; font-size: 9.5px; font-weight: 500\">Mob Construction<\u002Fdiv>\n          <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; color: #5F6368; border-radius: 999px; padding: 3px 10px; font-size: 9.5px\">Mob Programming<\u002Fdiv>\n          <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; color: #5F6368; border-radius: 999px; padding: 3px 10px; font-size: 9.5px\">Mob Testing<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1.5px dashed #9AA0A6; border-radius: 16px; padding: 12px\">\n        <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px\">\n          <div style=\"border: 1.5px dashed #BDC1C6; border-radius: 14px; padding: 9px 8px; display: flex; flex-direction: column; align-items: stretch\">\n            <div style=\"align-self: center; background: #FFFFFF; border: 1px solid #A142F4; color: #7627c9; border-radius: 999px; padding: 2px 8px; font-size: 9.5px; font-weight: 500; white-space: nowrap\">Bolt 1<\u002Fdiv>\n            <div style=\"margin-top: 7px; display: flex; flex-direction: column\">\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Domain Design<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; align-items: center; margin: 5px 0\"><div style=\"width: 1.5px; height: 8px; background: #202124\"><\u002Fdiv><div style=\"width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #202124\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Logical Design + ADR<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; align-items: center; margin: 5px 0\"><div style=\"width: 1.5px; height: 8px; background: #202124\"><\u002Fdiv><div style=\"width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #202124\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Code + Unit Test<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border: 1.5px dashed #BDC1C6; border-radius: 14px; padding: 9px 8px; display: flex; flex-direction: column; align-items: stretch\">\n            <div style=\"align-self: center; background: #FFFFFF; border: 1px solid #A142F4; color: #7627c9; border-radius: 999px; padding: 2px 8px; font-size: 9.5px; font-weight: 500; white-space: nowrap\">Bolt 2<\u002Fdiv>\n            <div style=\"margin-top: 7px; display: flex; flex-direction: column\">\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Domain Design<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; align-items: center; margin: 5px 0\"><div style=\"width: 1.5px; height: 8px; background: #202124\"><\u002Fdiv><div style=\"width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #202124\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Logical Design + ADR<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; align-items: center; margin: 5px 0\"><div style=\"width: 1.5px; height: 8px; background: #202124\"><\u002Fdiv><div style=\"width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #202124\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Code + Unit Test<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border: 1.5px dashed #BDC1C6; border-radius: 14px; padding: 9px 8px; display: flex; flex-direction: column; align-items: stretch\">\n            <div style=\"align-self: center; background: #FFFFFF; border: 1px solid #A142F4; color: #7627c9; border-radius: 999px; padding: 2px 8px; font-size: 9.5px; font-weight: 500; white-space: nowrap\">Bolt n<\u002Fdiv>\n            <div style=\"margin-top: 7px; display: flex; flex-direction: column\">\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Domain Design<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; align-items: center; margin: 5px 0\"><div style=\"width: 1.5px; height: 8px; background: #202124\"><\u002Fdiv><div style=\"width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #202124\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Logical Design + ADR<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; align-items: center; margin: 5px 0\"><div style=\"width: 1.5px; height: 8px; background: #202124\"><\u002Fdiv><div style=\"width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #202124\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Code + Unit Test<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border: 1.5px dashed #BDC1C6; border-radius: 14px; padding: 9px 8px; display: flex; flex-direction: column; align-items: stretch\">\n            <div style=\"align-self: center; background: #FFFFFF; border: 1px solid #A142F4; color: #7627c9; border-radius: 999px; padding: 2px 8px; font-size: 9.5px; font-weight: 500; white-space: nowrap\">Bolt n+1<\u002Fdiv>\n            <div style=\"margin-top: 7px; display: flex; flex-direction: column\">\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Domain Design<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; align-items: center; margin: 5px 0\"><div style=\"width: 1.5px; height: 8px; background: #202124\"><\u002Fdiv><div style=\"width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #202124\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Logical Design + ADR<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; align-items: center; margin: 5px 0\"><div style=\"width: 1.5px; height: 8px; background: #202124\"><\u002Fdiv><div style=\"width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #202124\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 8px 10px; font-size: 10.5px; line-height: 1.35; \">Code + Unit Test<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: 9px; font-size: 9.5px; color: #5F6368; text-align: center; line-height: 1.45\">Một Unit chạy qua một hoặc nhiều Bolt, song song hoặc tuần tự · brown-field thêm bước nâng mã lên mô hình tĩnh và động ở đầu pha<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; line-height: 1.4\">\n        <div style=\"border-left: 2px solid #A142F4; padding-left: 9px\">Domain Design<\u002Fdiv>\n        <div style=\"border-left: 2px solid #A142F4; padding-left: 9px\">Logical Design + ADR<\u002Fdiv>\n        <div style=\"border-left: 2px solid #A142F4; padding-left: 9px\">Code + Unit Test<\u002Fdiv>\n        <div style=\"border-left: 2px solid #A142F4; padding-left: 9px\">Deployment Unit đã kiểm thử, bảo mật, <br>đóng gói<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 124px 1fr 134px; gap: 12px\"><div><\u002Fdiv><div><div style=\"display: flex; flex-direction: column; align-items: center; margin: 5px 0\"><div style=\"width: 1.5px; height: 14px; background: #202124\"><\u002Fdiv><div style=\"width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #202124\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 124px 1fr 134px; gap: 12px; align-items: start\">\n      <div>\n        <div style=\"font-size: 15px; letter-spacing: -0.02em; color: #1e7e34\">Operations<\u002Fdiv>\n        <div style=\"margin-top: 5px; font-size: 10.5px; line-height: 1.45; color: #5F6368\">Product Owner, Developers, AI<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1.5px dashed #9AA0A6; border-radius: 16px; padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px\">\n        <div style=\"border-radius: 10px; overflow: hidden; border: 1px solid #34A853\"><div style=\"background: #FFFFFF; padding: 7px 10px; font-size: 10.5px; line-height: 1.35\">Deployment Unit<\u002Fdiv><div style=\"background: #34A853; color: #FFFFFF; padding: 4px 10px; font-size: 9px\">Production<\u002Fdiv><\u002Fdiv>\n        <div style=\"border-radius: 10px; overflow: hidden; border: 1px solid #34A853\"><div style=\"background: #FFFFFF; padding: 7px 10px; font-size: 10.5px; line-height: 1.35\">Deployment Unit<\u002Fdiv><div style=\"background: #34A853; color: #FFFFFF; padding: 4px 10px; font-size: 9px\">Production<\u002Fdiv><\u002Fdiv>\n        <div style=\"border-radius: 10px; overflow: hidden; border: 1px solid #34A853\"><div style=\"background: #FFFFFF; padding: 7px 10px; font-size: 10.5px; line-height: 1.35\">Deployment Unit<\u002Fdiv><div style=\"background: #34A853; color: #FFFFFF; padding: 4px 10px; font-size: 9px\">Production<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; line-height: 1.4\">\n        <div style=\"border-left: 2px solid #34A853; padding-left: 9px\">Telemetry, anomaly, dự báo vi phạm SLA<\u002Fdiv>\n        <div style=\"border-left: 2px solid #34A853; padding-left: 9px\">Hành động theo runbook, chờ Developer phê duyệt<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 12px; background: #E8F0FE; border-radius: 12px; padding: 9px 14px; font-size: 10.5px; line-height: 1.45; color: #1a56c4; text-align: center\">Ở mọi điểm phân rã, AI đề xuất trước và con người xác nhận trước khi đi tiếp.<\u002Fdiv>\n  <\u002Fdiv>\n  <figcaption style=\"margin-top: 8px; font-size: 10.5px; color: #5F6368; line-height: 1.5; max-width: 660px; margin-left: auto; margin-right: auto\">Hình 1. Intent được phân rã thành Unit ở Inception, mỗi Unit được xây qua một hoặc nhiều Bolt ở Construction, và kết quả là các Deployment Unit đi vào Operations. Cột trái là vai trò và nghi thức, cột phải là artefact sinh ra ở từng pha.<\u002Ffigcaption>\n<\u002Ffigure>\n\n<h2 style=\"break-after: avoid; font-size: 32px; font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; margin: 22px 0 4px\">III. Framework cốt lõi<\u002Fh2>\n<div style=\"height: 2px; background: #202124; width: 64px; margin-bottom: 12px\"><\u002Fdiv>\n<div style=\"font-size: 13.5px; line-height: 1.62; color: #5F6368; max-width: 62ch; margin-bottom: 16px\">Phần này trình bày framework cốt lõi của AI-DLC, gồm các pha, vai trò, workflow và artefact chính.<\u002Fdiv>\n\n<h3 style=\"break-after: avoid; font-size: 17px; font-weight: 500; margin: 0 0 10px; letter-spacing: -0.01em\">1. Artefact<\u002Fh3>\n<div style=\"column-count: 2; column-gap: 30px; font-size: 13.5px; line-height: 1.62; text-wrap: pretty\">\n  <div style=\"break-inside: avoid; margin-bottom: 18px; border-left: 2px solid #4285F4; padding-left: 14px\">\n    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 8px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4285F4\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 30px; height: 30px\"><circle cx=\"11\" cy=\"13\" r=\"7\"><\u002Fcircle><circle cx=\"11\" cy=\"13\" r=\"3.2\"><\u002Fcircle><path d=\"M11 13l8-8\"><\u002Fpath><path d=\"M15.5 5.5H19V9\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 15px; font-weight: 500; letter-spacing: -0.01em\">Intent<\u002Fspan><\u002Fdiv>\n    <p><b style=\"font-weight: 500\">Intent<\u002Fb> trong AI-DLC là phát biểu mục đích cấp cao, mô tả điều cần đạt được, có thể là mục tiêu kinh doanh, tính năng hoặc kết quả kỹ thuật, ví dụ mở rộng hiệu năng. Đây là điểm xuất phát để AI phân rã thành nhiệm vụ có thể hành động, đồng bộ mục tiêu của con người với kế hoạch do AI tạo.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px; border-left: 2px solid #34A853; padding-left: 14px\">\n    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 8px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#34A853\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 30px; height: 30px\"><rect x=\"3.5\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.6\"><\u002Frect><rect x=\"13.5\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.6\"><\u002Frect><rect x=\"3.5\" y=\"13.5\" width=\"7\" height=\"6.5\" rx=\"1.6\"><\u002Frect><rect x=\"13.5\" y=\"13.5\" width=\"7\" height=\"6.5\" rx=\"1.6\"><\u002Frect><\u002Fsvg><span style=\"font-size: 15px; font-weight: 500; letter-spacing: -0.01em\">Unit<\u002Fspan><\u002Fdiv>\n    <p><b style=\"font-weight: 500\">Unit<\u002Fb> là phần việc gắn kết, tự chứa, được dẫn xuất từ một Intent và được thiết kế để tạo ra giá trị đo được. Chẳng hạn, Intent triển khai một ý tưởng kinh doanh có thể được phân rã thành các Unit là những khối chức năng độc lập, tương tự Subdomain trong DDD hoặc Epic trong Scrum. Mỗi Unit bao gồm một tập nhiệm vụ, ở đây là các user story mô tả phạm vi chức năng. Trong AI-DLC, AI dẫn dắt việc phân rã Intent thành Unit; lập trình viên và/hoặc Product Owner xác nhận, tinh chỉnh các Unit để phù hợp mục tiêu kinh doanh và kỹ thuật. Các Unit lỏng ghép, cho phép phát triển tự chủ và triển khai độc lập ở hạ nguồn.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px; border-left: 2px solid #EA4335; padding-left: 14px\">\n    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 8px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EA4335\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 30px; height: 30px\"><path d=\"M12 3c3.2 2.1 5 5.5 5 9.2L14.4 15H9.6L7 12.2C7 8.5 8.8 5.1 12 3z\"><\u002Fpath><circle cx=\"12\" cy=\"9.6\" r=\"1.8\"><\u002Fcircle><path d=\"M9.6 15l-1.9 3.6 3.3-1.1M14.4 15l1.9 3.6-3.3-1.1\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 15px; font-weight: 500; letter-spacing: -0.01em\">Bolt<\u002Fspan><\u002Fdiv>\n    <p><b style=\"font-weight: 500\">Bolt<\u002Fb> là vòng lặp nhỏ nhất trong AI-DLC, dành cho việc triển khai nhanh một Unit hoặc một tập nhiệm vụ trong Unit. Bolt, tương tự Sprint trong Scrum, nhấn mạnh sự tập trung cao và tốc độ giao hàng lớn, với chu kỳ xây dựng - xác nhận tính bằng giờ hoặc ngày thay vì tuần. Mỗi Bolt gói một phạm vi rõ ràng, ví dụ tập user story trong một Unit, giúp tiến triển từng bước mà vẫn bám mục tiêu chung của Unit. Một Unit có thể được thực thi qua một hay nhiều Bolt chạy song song hoặc nối tiếp. AI lập kế hoạch Bolt, còn lập trình viên hoặc Product Owner xác nhận.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px; border-left: 2px solid #A142F4; padding-left: 14px\">\n    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 8px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A142F4\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 30px; height: 30px\"><circle cx=\"6\" cy=\"7\" r=\"2.2\"><\u002Fcircle><circle cx=\"18\" cy=\"9\" r=\"2.2\"><\u002Fcircle><circle cx=\"11\" cy=\"18\" r=\"2.2\"><\u002Fcircle><path d=\"M7.8 8.4l1.9 7.7M16.6 10.8l-3.9 5.7M8 6.4l7.9 2\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 15px; font-weight: 500; letter-spacing: -0.01em\">Domain Design &amp; Logical Design<\u002Fspan><\u002Fdiv>\n    <p>Artefact <b style=\"font-weight: 500\">Domain Design<\u002Fb> mô hình hóa logic nghiệp vụ cốt lõi của một Unit, độc lập với hạ tầng. Trong phiên bản đầu của AI-DLC, AI sử dụng DDD để tạo các phần tử mô hình chiến lược và chiến thuật, gồm aggregate, value object, entity, domain event, repository và factory. <b style=\"font-weight: 500\">Logical Design<\u002Fb> chuyển hóa Domain Design bằng cách mở rộng nó để đáp ứng yêu cầu phi chức năng với mẫu kiến trúc phù hợp, ví dụ CQRS hay Circuit Breaker. AI tạo Architecture Decision Record (ADR — biên bản ghi quyết định kiến trúc) để lập trình viên xác nhận. Từ đặc tả Logical Design, AI sinh Code và Unit Test, tuân theo nguyên tắc well-architected bằng cách chọn dịch vụ và cấu trúc AWS phù hợp. Ở bước này, tác tử AI chạy unit test, phân tích kết quả và đề xuất cách sửa cho lập trình viên.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px; border-left: 2px solid #34A853; padding-left: 14px\">\n    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 8px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1e7e34\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 30px; height: 30px\"><path d=\"M12 3.5l7.5 4v9L12 20.5 4.5 16.5v-9z\"><\u002Fpath><path d=\"M4.5 7.5L12 11.6l7.5-4.1M12 11.6V20.5\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 15px; font-weight: 500; letter-spacing: -0.01em\">Deployment Unit<\u002Fspan><\u002Fdiv>\n    <p><b style=\"font-weight: 500\">Deployment Unit<\u002Fb> là artefact vận hành gồm mã thực thi đã đóng gói, ví dụ container image cho Kubernetes hoặc hàm serverless như AWS Lambda; cấu hình, ví dụ Helm Chart; và thành phần hạ tầng, ví dụ Terraform hoặc CloudFormation stack. Tất cả đã được kiểm thử về chấp nhận chức năng, bảo mật, NFR và các rủi ro khác. AI tạo toàn bộ kiểm thử liên quan, gồm kiểm thử chức năng, bảo mật tĩnh và động, cùng kịch bản tải. Sau khi con người xác nhận và điều chỉnh kịch bản, trường hợp kiểm thử, tác tử AI chạy test suite, phân tích kết quả và liên hệ điểm lỗi với thay đổi mã, cấu hình hoặc phụ thuộc khác. Nhờ đó, các Unit được kiểm thử nghiêm ngặt về chức năng, tuân thủ bảo mật, NFR và giảm thiểu rủi ro vận hành, bảo đảm sẵn sàng triển khai liền mạch.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"break-after: avoid; font-size: 17px; font-weight: 500; margin: 20px 0 10px; letter-spacing: -0.01em\">2. Các phase và nghi thức<\u002Fh3>\n<div style=\"column-count: 2; column-gap: 30px; font-size: 13.5px; line-height: 1.62; text-wrap: pretty\">\n  <div style=\"break-inside: avoid; margin-bottom: 18px; border-left: 2px solid #4285F4; padding-left: 14px\">\n    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 8px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4285F4\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 40px; height: 35px\"><circle cx=\"11\" cy=\"13\" r=\"7\"><\u002Fcircle><circle cx=\"11\" cy=\"13\" r=\"3.2\"><\u002Fcircle><path d=\"M11 13l8-8\"><\u002Fpath><path d=\"M15.5 5.5H19V9\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 15px; font-weight: 500; letter-spacing: -0.01em\">Phase Inception<\u002Fspan><\u002Fdiv>\n    <p><b style=\"font-weight: 500\">Pha Inception<\u002Fb> tập trung thu thập Intent và chuyển chúng thành Unit để phát triển. Pha này dùng <b style=\"font-weight: 500\">Mob Elaboration<\u002Fb>, nghi thức cộng tác làm rõ và phân rã yêu cầu. Hoạt động diễn ra trong một phòng với màn hình chung và người điều phối. Trong Mob Elaboration, AI giữ vai trò trung tâm khi đề xuất cách phân rã ban đầu từ Intent thành User Story, Acceptance Criteria và Unit, tận dụng tri thức miền cùng nguyên tắc lỏng ghép, gắn kết cao để thực thi song song nhanh ở hạ nguồn.<\u002Fp>\n    <p>Product Owner, lập trình viên, QA và stakeholder liên quan, tức mob (nhóm cùng ngồi một phòng), cùng rà soát và tinh chỉnh artefact do AI tạo bằng cách sửa các phần thiết kế thiếu hoặc quá mức, đồng thời điều chỉnh theo giới hạn thực tế. Đầu ra của pha gồm các Unit được định nghĩa rõ, mỗi Unit chứa: a) PR-FAQ; b) User Story; c) định nghĩa Non-Functional Requirement (NFR — yêu cầu phi chức năng); d) mô tả rủi ro khớp Risk Register của tổ chức nếu có; e) tiêu chí đo lường truy vết về Intent kinh doanh; và f) Bolt đề xuất để xây dựng Unit. Mob Elaboration rút công việc tuần tự kéo dài vài tuần hoặc vài tháng xuống vài giờ, đồng thời tạo sự đồng thuận sâu trong mob và giữa mob với AI.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px; border-left: 2px solid #A142F4; padding-left: 14px\">\n    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 8px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A142F4\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 40px; height: 40px\"><circle cx=\"6\" cy=\"7\" r=\"2.2\"><\u002Fcircle><circle cx=\"18\" cy=\"9\" r=\"2.2\"><\u002Fcircle><circle cx=\"11\" cy=\"18\" r=\"2.2\"><\u002Fcircle><path d=\"M7.8 8.4l1.9 7.7M16.6 10.8l-3.9 5.7M8 6.4l7.9 2\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 15px; font-weight: 500; letter-spacing: -0.01em\">Phase Construction<\u002Fspan><\u002Fdiv>\n    <p><b style=\"font-weight: 500\">Pha Construction<\u002Fb> bao gồm việc thực thi nhiệm vụ theo vòng lặp, chuyển các Unit đã định nghĩa ở Inception thành Deployment Unit đã kiểm thử và sẵn sàng vận hành. Pha đi từ Domain Design, nơi AI mô hình hóa logic nghiệp vụ độc lập với kỹ thuật, sang Logical Design, nơi áp dụng NFR và mẫu thiết kế cloud phù hợp. AI sinh mã chi tiết từ Logical Design bằng cách ánh xạ thành phần sang dịch vụ AWS thích hợp, tuân theo nguyên tắc well-architected. Pha kết thúc bằng kiểm thử tự động để bảo đảm chức năng, bảo mật và mức sẵn sàng vận hành. Lập trình viên tập trung xác nhận đầu ra do AI tạo ở mỗi bước và đưa ra quyết định quan trọng, bảo đảm chất lượng và khả năng thích ứng trong từng vòng lặp.<\u002Fp>\n    <p>Trong tình huống brown-field, tức ứng dụng hiện có, Construction trước tiên nâng mã lên biểu diễn mô hình giàu ngữ nghĩa để ngữ cảnh cung cấp cho AI ngắn gọn và chính xác. Các biểu diễn được đề xuất là mô hình tĩnh, chỉ ra thành phần miền, trách nhiệm và quan hệ, cùng mô hình động, mô tả cách các thành phần tương tác để hiện thực use case quan trọng.<\u002Fp>\n    <p>Trong suốt pha này, AI giữ vai trò then chốt: khuyến nghị nhiệm vụ và đưa ra lựa chọn về mẫu thiết kế, trải nghiệm người dùng, kiểm thử ở từng task. AI-DLC khuyến nghị các nhóm cùng làm việc trong một phòng như Mob Elaboration. Các nhóm trao đổi đặc tả tích hợp từ giai đoạn mô hình miền, đưa ra quyết định và giao Bolt. AI-DLC gọi nghi thức này là <b style=\"font-weight: 500\">Mob Construction<\u002Fb>.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside: avoid; margin-bottom: 18px; border-left: 2px solid #34A853; padding-left: 14px\">\n    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 8px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#34A853\" stroke-width=\"1.5\" stroke-linecap=\"round\" style=\"width: 40px; height: 40px\"><path d=\"M4 20V13M9 20V8M14 20V15M19 20V5\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 15px; font-weight: 500; letter-spacing: -0.01em\">Phase Operations<\u002Fspan><\u002Fdiv>\n    <p><b style=\"font-weight: 500\">Pha Operations<\u002Fb> trong AI-DLC tập trung triển khai, observability và bảo trì hệ thống, tận dụng AI để tăng hiệu quả vận hành. AI chủ động phân tích telemetry, gồm metric, log và trace, để phát hiện mẫu, nhận diện bất thường và dự đoán nguy cơ vi phạm SLA, nhờ đó chủ động xử lý vấn đề. AI cũng tích hợp với incident runbook đã định nghĩa, đề xuất hành động như scale tài nguyên, tinh chỉnh hiệu năng hoặc cô lập lỗi, rồi thực thi khi lập trình viên phê duyệt. Lập trình viên đóng vai trò xác nhận, bảo đảm insight và hành động do AI đề xuất phù hợp SLA và yêu cầu tuân thủ.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"break-after: avoid; font-size: 17px; font-weight: 500; margin: 20px 0 10px; letter-spacing: -0.01em\">3. Workflow<\u002Fh3>\n<div style=\"column-count: 2; column-gap: 30px; font-size: 13.5px; line-height: 1.62; text-wrap: pretty\">\n  <p>Với một Intent kinh doanh, ví dụ phát triển green-field, nâng cấp brown-field, hiện đại hóa hoặc sửa lỗi, AI-DLC bắt đầu bằng việc yêu cầu AI tạo Kế hoạch Cấp 1 mô tả workflow để thực hiện Intent. Kế hoạch là đề xuất ban đầu, sau đó con người xem xét minh bạch, xác nhận và tinh chỉnh để phù hợp mục tiêu kinh doanh và giới hạn kỹ thuật. Cốt lõi của AI-DLC là áp dụng sự giám sát của con người để từng bước làm giàu artefact, biến chúng thành ngữ cảnh giàu ngữ nghĩa cho bước tiếp theo. Mỗi bước là một điểm quyết định chiến lược, nơi sự giám sát của con người hoạt động như hàm mất mát: bắt và sửa lỗi sớm trước khi chúng lan rộng về hạ nguồn. Quá trình lặp lại theo đệ quy. Mỗi bước của Kế hoạch Cấp 1 tiếp tục được AI phân rã thành nhiệm vụ con chi tiết, có thể thực thi, vẫn dưới sự giám sát của con người để bảo đảm chính xác và phù hợp bối cảnh.<\u002Fp>\n  <p style=\"margin-bottom: 0\">Mọi artefact được tạo, như Intent, user story, mô hình miền hay kế hoạch kiểm thử, đều được lưu bền vững và trở thành bộ nhớ ngữ cảnh (context memory) mà AI tham chiếu xuyên vòng đời. Giống SDLC truyền thống, AI-DLC mang tính lặp, cho phép tinh chỉnh và thích ứng liên tục. Các artefact cũng được liên kết để truy vết xuôi và ngược, ví dụ nối phần tử mô hình miền với user story, bảo đảm AI lấy đúng ngữ cảnh liên quan nhất ở mọi giai đoạn. Xuyên suốt quá trình, AI thực hiện lập kế hoạch chiến lược, phân rã nhiệm vụ, sinh artefact, còn con người giám sát và xác nhận.<\u002Fp>\n<\u002Fdiv>\n\n<figure style=\"margin: 22px 0 0; break-inside: avoid\">\n  <div style=\"background: #F8F9FA; border: 1px solid #DADCE0; border-radius: 22px; padding: 20px 22px; max-width: 600px; margin: 0 auto\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n      <div style=\"font-size: 19px; font-weight: 400; letter-spacing: -0.02em\">Kế hoạch Cấp 1: chín bước<\u002Fdiv>\n      <div style=\"font-size: 10px; color: #5F6368; letter-spacing: 0.08em; text-transform: uppercase\">Hình 2 · Level 1 Plan<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 14px; display: grid; grid-template-columns: 30px 1fr 40px 132px; gap: 10px; align-items: stretch\">\n      <div style=\"display: flex; flex-direction: column; justify-content: space-around; align-items: center\">\n        <svg width=\"26\" height=\"86\" sc-camel-view-box=\"0 0 26 86\" fill=\"none\" stroke=\"#5F6368\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"3 3\"><path d=\"M22 78C6 70 2 54 4 38 5 26 11 14 22 8\"><\u002Fpath><path d=\"M1
