ze: 9.5px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: #5F6368; white-space: nowrap\">Mob Testing<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 12px; display: flex; align-items: center; gap: 10px; background: #E8F0FE; border-radius: 12px; padding: 9px 14px; font-size: 10.5px; line-height: 1.45; color: #1a56c4\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EA4335\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3c3.2 2.1 5 5.5 5 9.2L14.4 15H9.6L7 12.2C7 8.5 8.8 5.1 12 3z\"><\u002Fpath><circle cx=\"12\" cy=\"9.6\" r=\"1.8\"><\u002Fcircle><path d=\"M9.6 15l-1.9 3.6 3.3-1.1M14.4 15l1.9 3.6-3.3-1.1\"><\u002Fpath><\u002Fsvg>\n      <span>Mỗi Bolt là một lần tăng tốc: AI khởi động, con người xác nhận, chu kỳ khép lại trong vài giờ đến vài ngày.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <figcaption style=\"margin-top: 8px; font-size: 10.5px; color: #5F6368; line-height: 1.5\">Hình 3. Mũi tên chỉ chiều khởi xướng: AI mở phần lớn các bước, con người phê duyệt và hiệu chỉnh. Mũi tên hai chiều là các vòng trao đổi qua lại cho tới khi hai bên đồng thuận.<\u002Ffigcaption>\n<\u002Ffigure>\n\n<h2 style=\"break-after: avoid; font-size: 32px; font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; margin: 22px 0 4px\">IV. AI-DLC trong thực tế: phát triển green-field<\u002Fh2>\n<div style=\"height: 2px; background: #202124; width: 64px; margin-bottom: 12px\"><\u002Fdiv>\n<div style=\"font-size: 13.5px; line-height: 1.62; max-width: 74ch; margin-bottom: 16px; text-wrap: pretty\">Chúng ta xét tình huống Product Owner bắt đầu bằng một Intent cấp cao, chẳng hạn: \"Phát triển công cụ gợi ý để bán chéo sản phẩm.\" AI nhận diện đây là Intent xây dựng ứng dụng mới và tạo Kế hoạch Cấp 1 theo các bước Workflow ở phần trên. Nhóm xác nhận, kiểm chứng, bổ sung hoặc sửa các giai đoạn trong kế hoạch. Khi Kế hoạch Cấp 1 được chốt, AI chuyển sang pha Inception. Có thể tham khảo prompt trong Phụ lục A để tương tác và giám sát AI.<\u002Fdiv>\n\n<div style=\"column-count: 2; column-gap: 30px; font-size: 13.5px\">\n  <div style=\"margin-bottom: 16px\">\n    <div style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 15px; letter-spacing: -0.01em\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: rgb(66, 133, 244);\"><\u002Fspan>Phase Inception<\u002Fdiv>\n    <div style=\"margin-top: 6px; font-size: 11.5px; color: #5F6368; line-height: 1.5\">Các ý sau mô tả tương tác chính trong nghi thức Mob Elaboration.<\u002Fdiv>\n    <div style=\"margin-top: 10px; display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; line-height: 1.55\">\n      <div style=\"border-left: 2px solid #4285F4; padding-left: 12px\">a. AI đặt câu hỏi làm rõ, ví dụ: \"Ai là người dùng chính? Kết quả kinh doanh quan trọng cần đạt là gì?\", để hiểu toàn diện mục tiêu và giảm mơ hồ trong Intent ban đầu.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #4285F4; padding-left: 12px\">b. AI làm rõ Intent thành user story, yêu cầu phi chức năng (NFR) và mô tả rủi ro. Nhóm xác nhận các artefact, giám sát và cung cấp phần sửa cần thiết cho AI.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #4285F4; padding-left: 12px\">c. AI nhóm các story có độ gắn kết cao thành Unit, ví dụ \"Thu thập Dữ liệu Người dùng\", \"Lựa chọn Thuật toán Gợi ý\" và \"Tích hợp API\".<\u002Fdiv>\n      <div style=\"border-left: 2px solid #4285F4; padding-left: 12px\">d. Product Owner xác nhận các đầu ra và điều chỉnh để tinh chỉnh Unit. Ví dụ, Product Owner nhận thấy Unit Thu thập Dữ liệu Người dùng thiếu chi tiết tuân thủ quyền riêng tư và bổ sung yêu cầu dành riêng cho GDPR.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #4285F4; padding-left: 12px\">e. AI tạo PR-FAQ cho mô-đun nếu cần, tóm tắt Intent kinh doanh, chức năng và lợi ích kỳ vọng.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #4285F4; padding-left: 12px\">f. Lập trình viên và Product Owner xác nhận PR-FAQ cùng rủi ro liên quan, bảo đảm phù hợp mục tiêu chung.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-bottom: 16px\">\n    <div style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 15px; letter-spacing: -0.01em\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: rgb(161, 66, 244);\"><\u002Fspan>Phase Construction<\u002Fdiv>\n    <div style=\"margin-top: 6px; font-size: 11.5px; color: #5F6368; line-height: 1.5\">Các ý sau mô tả hoạt động chính của pha, tập trung vào nghi thức Mob Programming và Mob Testing.<\u002Fdiv>\n    <div style=\"margin-top: 10px; display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; line-height: 1.55\">\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">a. Developer thiết lập phiên với AI. AI yêu cầu Developer bắt đầu bằng Unit được giao.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">b. AI mô hình hóa logic nghiệp vụ cốt lõi của Unit theo DDD. Ví dụ, với Unit \"Thuật toán Gợi ý\", AI xác định các entity liên quan như Product, Customer, Purchase History và quan hệ giữa chúng.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">c. Developer rà soát và xác nhận mô hình miền, tinh chỉnh logic nghiệp vụ và bảo đảm phù hợp tình huống thực, ví dụ cách xử lý khách hàng mới chưa có lịch sử mua hàng.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">d. AI chuyển mô hình miền thành thiết kế logic, áp dụng NFR như khả năng mở rộng và chịu lỗi. Ví dụ, AI đề xuất mẫu event-driven và công nghệ AWS Lambda cho tính toán serverless.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">e. Developer đánh giá khuyến nghị của AI, phê duyệt trade-off và bổ sung cân nhắc khi cần. Ví dụ, chấp nhận Lambda để mở rộng nhưng đổi kho lưu trữ sang DynamoDB để truy vấn nhanh hơn.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">f. AI sinh mã thực thi cho từng Unit, ánh xạ thành phần logic sang dịch vụ AWS cụ thể.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">g. AI cũng tự sinh kiểm thử chức năng, bảo mật và hiệu năng. Ví dụ, với Unit \"Thuật toán Gợi ý\", AI tạo mã triển khai collaborative filtering và tích hợp với nguồn dữ liệu DynamoDB.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">h. Developer rà soát mã và kịch bản/trường hợp kiểm thử do AI tạo, điều chỉnh khi cần để bảo đảm chất lượng và tuân thủ.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top: 14px; column-count: 2; column-gap: 30px; font-size: 13.5px\">\n  <div style=\"background: #E8EAED; border-radius: 24px; padding: 20px 22px; break-inside: avoid\">\n    <div style=\"font-size: 13px; font-weight: 500\">Kiểm thử và xác nhận<\u002Fdiv>\n    <div style=\"margin-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; line-height: 1.55\">\n      <div style=\"border-left: 2px solid #202124; padding-left: 12px\">a. AI chạy toàn bộ kiểm thử chức năng, bảo mật và hiệu năng; phân tích kết quả và nêu bật vấn đề.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #202124; padding-left: 12px\">b. AI đề xuất cách sửa cho test thất bại, ví dụ tối ưu logic truy vấn để tăng hiệu năng.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #202124; padding-left: 12px\">c. Developer xác nhận phát hiện của AI, phê duyệt bản sửa và chạy lại test khi cần.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-bottom: 16px\">\n    <div style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 15px; letter-spacing: -0.01em\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: rgb(52, 168, 83);\"><\u002Fspan>Phase Operations<\u002Fdiv>\n    <div style=\"margin-top: 10px; font-size: 11.5px; color: #5F6368\">Triển khai<\u002Fdiv>\n    <div style=\"margin-top: 6px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; line-height: 1.55\">\n      <div style=\"border-left: 2px solid #34A853; padding-left: 12px\">a. AI đóng gói mô-đun thành Deployment Unit, ví dụ container image hoặc hàm serverless.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #34A853; padding-left: 12px\">b. Developer phê duyệt cấu hình triển khai và khởi tạo rollout tới môi trường staging và production.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 12px; font-size: 11.5px; color: #5F6368\">Quan sát và giám sát<\u002Fdiv>\n    <div style=\"margin-top: 6px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; line-height: 1.55\">\n      <div style=\"border-left: 2px solid #34A853; padding-left: 12px\">a. AI phân tích metric, log và trace để nhận diện bất thường và dự đoán nguy cơ vi phạm SLA. Ví dụ, AI phát hiện độ trễ tăng trong giờ cao điểm và đề xuất scale công cụ gợi ý để đáp ứng tải.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #34A853; padding-left: 12px\">b. AI tích hợp với playbook để đề xuất hành động xử lý vấn đề vận hành. Nếu thời gian phản hồi API giảm, AI khuyến nghị tăng throughput DynamoDB hoặc cân bằng lại lưu lượng API Gateway.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #34A853; padding-left: 12px\">c. Developer xác nhận khuyến nghị của AI, phê duyệt biện pháp giảm thiểu và theo dõi kết quả xử lý.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"break-after: avoid; font-size: 32px; font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; margin: 22px 0 4px\">V. AI-DLC trong thực tế: phát triển brown-field<\u002Fh2>\n<div style=\"height: 2px; background: #202124; width: 64px; margin-bottom: 12px\"><\u002Fdiv>\n<div style=\"font-size: 13.5px; line-height: 1.62; max-width: 74ch; margin-bottom: 14px; text-wrap: pretty\">Brown-field là thay đổi hệ thống hiện có bằng cách thêm tính năng, tối ưu NFR hoặc xử lý nợ kỹ thuật, gồm refactor và sửa lỗi. Ở đây, ta xét tình huống Product Manager cần thêm tính năng mới vào ứng dụng hiện hữu.<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 20px; align-items: start; break-inside: avoid\">\n  <div style=\"border: 1px solid #DADCE0; border-radius: 24px; padding: 18px 20px\">\n    <div style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #4285F4\"><\u002Fspan>Inception<\u002Fdiv>\n    <div style=\"margin-top: 8px; font-size: 12.5px; line-height: 1.55; color: #5F6368\">Hoạt động Inception trong brown-field giống green-field.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border: 1px solid #DADCE0; border-radius: 24px; padding: 18px 20px\">\n    <div style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #A142F4\"><\u002Fspan>Construction<\u002Fdiv>\n    <div style=\"margin-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; line-height: 1.55\">\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">a. AI nâng mã lên biểu diễn mô hình cấp cao hơn: mô hình tĩnh, gồm thành phần, mô tả, trách nhiệm và quan hệ; cùng mô hình động, mô tả cách các thành phần tương tác để hiện thực những use case quan trọng nhất.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">b. Developer cộng tác với Product Manager để rà soát, xác nhận và sửa mô hình tĩnh, động do AI reverse-engineer.<\u002Fdiv>\n      <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">c. Sau các bước bổ sung này, phần còn lại của Construction tương tự green-field.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border: 1px solid #DADCE0; border-radius: 24px; padding: 18px 20px\">\n    <div style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #34A853\"><\u002Fspan>Operations<\u002Fdiv>\n    <div style=\"margin-top: 8px; font-size: 12.5px; line-height: 1.55; color: #5F6368\">Hoạt động Operations trong brown-field giống green-field.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"break-after: avoid; font-size: 32px; font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; margin: 22px 0 4px\">VI. Áp dụng AI-DLC<\u002Fh2>\n<div style=\"height: 2px; background: #202124; width: 64px; margin-bottom: 12px\"><\u002Fdiv>\n<div style=\"font-size: 13.5px; line-height: 1.62; max-width: 74ch; margin-bottom: 16px; text-wrap: pretty\">AI-DLC không khác biệt quá xa phương pháp Agile hiện có và được thiết kế với mục tiêu dễ áp dụng. Tuy vậy, tổ chức đã thực hành phương pháp truyền thống lâu năm hoặc đang tự tạo biến thể AI-Native cần chiến lược cụ thể để áp dụng AI-DLC. Chúng tôi cho rằng hai cách sau sẽ giúp việc này dễ hơn.<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; break-inside: avoid\">\n  <div style=\"background: #E8EAED; border-radius: 24px; padding: 18px 20px\">\n    <div style=\"font-size: 16px; letter-spacing: -0.01em\">a. Học bằng thực hành<\u002Fdiv>\n    <div style=\"margin-top: 10px; font-size: 12.5px; line-height: 1.6\">AI-DLC thực chất là một tập nghi thức như Mob Elaboration, Mob Construction, có thể được thực hành theo nhóm. Thay vì học qua tài liệu và đào tạo truyền thống, người thực hành dùng hướng dẫn AI-DLC để luyện các nghi thức trên nhiều tình huống thực tế họ đang xử lý. Các Solutions Architect của AWS đã tạo một field offering (gói hỗ trợ triển khai tại khách hàng) tên <b style=\"font-weight: 500\">AI-DLC Unicorn Gym<\u002Fb>, đóng gói cách tiếp cận này để mở rộng áp dụng nhanh trong tổ chức lớn.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background: #E8EAED; border-radius: 24px; padding: 18px 20px\">\n    <div style=\"font-size: 16px; letter-spacing: -0.01em\">b. Nhúng AI-DLC vào công cụ Developer Experience mới<\u002Fdiv>\n    <div style=\"margin-top: 10px; font-size: 12.5px; line-height: 1.6\">Khách hàng đang xây công cụ điều phối xuyên SDLC để cung cấp trải nghiệm thống nhất cho Developer, ví dụ FlowSource của Cognizant, CodeSpell của Aspire, AIForce của HCL. Khi AI-DLC được nhúng vào các công cụ này, Developer trong tổ chức lớn có thể thực hành liền mạch mà không cần chiến dịch áp dụng quy mô lớn.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"break-after: avoid; font-size: 32px; font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; margin: 22px 0 4px\">Thuật ngữ Anh - Việt<\u002Fh2>\n<div style=\"height: 2px; background: #202124; width: 64px; margin-bottom: 14px\"><\u002Fdiv>\n<sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 12px; line-height: 1.5\">\n  <sc-raw-thead>\n    <sc-raw-tr style=\"background: #202124; color: #F8F9FA\">\n      <sc-raw-th style=\"text-align: left; padding: 9px 12px; font-weight: 500; border-radius: 8px 0 0 8px; width: 22%\">Thuật ngữ<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align: left; padding: 9px 12px; font-weight: 500; width: 26%\">Cách hiểu tiếng Việt<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align: left; padding: 9px 12px; font-weight: 500; border-radius: 0 8px 8px 0\">Ghi chú trong AI-DLC<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr>\n  <\u002Fsc-raw-thead>\n  <sc-raw-tbody>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">Intent<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Ý định, mục đích cấp cao<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Điểm xuất phát của mọi vòng lặp; do con người phát biểu.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">Unit<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Khối công việc tự chứa<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Tương tự Subdomain trong DDD hoặc Epic trong Scrum; lỏng ghép với nhau.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">Bolt<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Vòng lặp nhỏ nhất<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Thay cho Sprint; chu kỳ xây dựng - xác nhận tính bằng giờ hoặc ngày.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">Deployment Unit<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Đơn vị triển khai<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Mã đã đóng gói, cấu hình và hạ tầng, đã kiểm thử chức năng, bảo mật, NFR.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">Mob Elaboration<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Nghi thức làm rõ yêu cầu theo nhóm<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Cả nhóm cùng một phòng, một màn hình, có người điều phối; diễn ra ở Inception.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">Mob Construction<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Nghi thức xây dựng theo nhóm<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Bao gồm Mob Programming và Mob Testing trong pha Construction.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">Level 1 Plan<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Kế hoạch Cấp 1<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Kế hoạch AI đề xuất đầu tiên; con người xác nhận trước khi phân rã tiếp.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">PR-FAQ<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Thông cáo báo chí kèm hỏi đáp<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Tài liệu mô tả sản phẩm theo lối Amazon; tùy chọn ở Inception.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">NFR<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Yêu cầu phi chức năng<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Được giải quyết ở bước Logical Design.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">ADR<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Biên bản quyết định kiến trúc<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">AI tạo, Developer xác nhận.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">Risk Register<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Sổ đăng ký rủi ro<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Artefact được giữ lại từ phương pháp cũ để bảo đảm tuân thủ.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-bottom: 1px solid #DADCE0\"><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">Green-field / Brown-field<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Hệ thống mới / hệ thống hiện có<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Brown-field thêm bước nâng mã lên mô hình tĩnh và động ở đầu Construction.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding: 8px 12px; font-weight: 500\">Loss function<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px\">Hàm mất mát<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 12px; color: #5F6368\">Cách ví về vai trò xác nhận của con người: cắt sai lệch trước khi lan xuống hạ nguồn.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n\n<div style=\"margin-top: 22px; padding-top: 12px; border-top: 1px solid #DADCE0; font-size: 10.5px; line-height: 1.55; color: #5F6368\">\n  <div><sup>1<\u002Fsup> Consortium for Information &amp; Software Quality (CISQ), <i>The Cost of Poor Software Quality in the US: A 2022 Report<\u002Fi>. Bản gốc tiếng Anh dẫn nguồn này qua liên kết \"study\".<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ showAppendix }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"break-before: page; padding-top: 4px\">\n  <h2 style=\"break-after: avoid; font-size: 32px; font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 4px\">Phụ lục A — bộ prompt<\u002Fh2>\n  <div style=\"height: 2px; background: #202124; width: 64px; margin-bottom: 12px\"><\u002Fdiv>\n  <div style=\"font-size: 13px; line-height: 1.6; color: #5F6368; max-width: 74ch\">Các prompt sau có thể được dùng để tương tác với AI khi thực hành AI-DLC. Tên tệp và tên thư mục giữ nguyên như bản gốc để dùng lại được ngay.<\u002Fdiv>\n\n  <div style=\"margin-top: 18px; display: flex; flex-direction: column; gap: 14px\">\n    <div style=\"background: #F8F9FA; border: 1px solid #DADCE0; border-radius: 20px; padding: 18px 20px; break-inside: avoid\">\n      <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6368\">Prompt thiết lập<\u002Fdiv>\n      <div style=\"margin-top: 10px; font-size: 12px; line-height: 1.62\">Hôm nay chúng ta sẽ xây dựng một ứng dụng. Với mỗi thành phần frontend và backend, chúng ta sẽ tạo một thư mục dự án. Mọi tài liệu nằm trong thư mục <span style=\"font-weight: 500\">aidlc-docs<\u002Fspan>. Trong suốt phiên làm việc, tôi sẽ yêu cầu bạn lập kế hoạch trước và tạo tệp md cho kế hoạch. Bạn chỉ được làm việc sau khi tôi phê duyệt kế hoạch đó. Kế hoạch luôn được lưu trong <span style=\"font-weight: 500\">aidlc-docs/plans<\u002Fspan>. Bạn sẽ tạo nhiều loại tài liệu định dạng md. Tài liệu yêu cầu và thay đổi tính năng nằm trong <span style=\"font-weight: 500\">aidlc-docs/requirements<\u002Fspan>. User story phải nằm trong <span style=\"font-weight: 500\">aidlc-docs/story-artifacts<\u002Fspan>. Tài liệu Kiến trúc và Thiết kế phải nằm trong <span style=\"font-weight: 500\">aidlc-docs/design-artifacts<\u002Fspan>. Toàn bộ prompt theo đúng thứ tự phải được lưu trong <span style=\"font-weight: 500\">aidlc-docs/prompts.md<\u002Fspan>. Hãy xác nhận bạn hiểu prompt này. Tạo các thư mục và tệp cần thiết để lưu trữ nếu chúng chưa tồn tại.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-top: 2px\">\n      <div style=\"font-size: 18px; letter-spacing: -0.01em; color: #4285F4\">Inception<\u002Fdiv>\n      <div style=\"flex: 1; height: 1px; background: #DADCE0\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #F8F9FA; border: 1px solid #DADCE0; border-radius: 20px; padding: 18px 20px; break-inside: avoid\">\n      <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6368\">User story<\u002Fdiv>\n      <div style=\"margin-top: 10px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Vai trò của bạn:<\u002Fb> Bạn là Product Manager chuyên gia, chịu trách nhiệm tạo user story rõ ràng làm hợp đồng phát triển hệ thống như mô tả trong phần Nhiệm vụ bên dưới. Hãy lập kế hoạch cho công việc và ghi các bước vào tệp md <span style=\"font-weight: 500\">user_stories_plan.md<\u002Fspan>, có checkbox cho từng bước. Nếu bước nào cần tôi làm rõ, hãy ghi chú trong bước đó để xin xác nhận. Không tự đưa ra quyết định quan trọng. Sau khi lập kế hoạch, hãy yêu cầu tôi rà soát và phê duyệt. Khi tôi đã phê duyệt, bạn có thể thực thi đúng kế hoạch từng bước. Hoàn thành bước nào thì đánh dấu checkbox của bước đó trong kế hoạch.<\u002Fdiv>\n      <div style=\"margin-top: 8px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Nhiệm vụ:<\u002Fb> Xây dựng user story cho yêu cầu cấp cao được mô tả tại đây &lt;&lt; mô tả sản phẩm &gt;&gt;<\u002Fdiv>\n      <div style=\"margin-top: 10px; padding-top: 10px; border-top: 1px solid #DADCE0; font-size: 12px; line-height: 1.62; color: #5F6368\">&lt;&lt;&lt;Sau khi rà soát và sửa kế hoạch&gt;&gt;&gt;<br>Đúng, tôi đồng ý với kế hoạch trong &lt;&lt;tệp md&gt;&gt;. Bây giờ hãy làm chính xác theo kế hoạch đó. Tương tác với tôi như quy định trong kế hoạch. Sau mỗi bước, đánh dấu checkbox hoàn tất.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #F8F9FA; border: 1px solid #DADCE0; border-radius: 20px; padding: 18px 20px; break-inside: avoid\">\n      <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6368\">Unit<\u002Fdiv>\n      <div style=\"margin-top: 10px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Vai trò của bạn:<\u002Fb> Bạn là Software Architect giàu kinh nghiệm. Trước khi bắt đầu nhiệm vụ bên dưới, hãy lập kế hoạch và ghi các bước vào <span style=\"font-weight: 500\">units_plan.md<\u002Fspan>, có checkbox cho từng bước. Nếu bước nào cần tôi làm rõ, hãy thêm nội dung tương tác vào bước đó để xin xác nhận. Không tự đưa ra quyết định quan trọng. Sau khi tạo kế hoạch, hãy yêu cầu tôi rà soát và phê duyệt. Khi được phê duyệt, hãy thực thi từng bước đúng kế hoạch. Hoàn thành bước nào thì đánh dấu checkbox của bước đó.<\u002Fdiv>\n      <div style=\"margin-top: 8px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Nhiệm vụ:<\u002Fb> Tham khảo user story trong tệp <span style=\"font-weight: 500\">mvp_user_stories.md<\u002Fspan>. Nhóm các user story thành nhiều Unit có thể xây dựng độc lập. Mỗi Unit chứa các user story có độ gắn kết cao để một nhóm duy nhất xây dựng. Các Unit lỏng ghép với nhau. Với từng Unit, ghi user story và acceptance criteria tương ứng vào các tệp md riêng trong thư mục <span style=\"font-weight: 500\">design/<\u002Fspan>.<\u002Fdiv>\n      <div style=\"margin-top: 10px; padding-top: 10px; border-top: 1px solid #DADCE0; font-size: 12px; line-height: 1.62; color: #5F6368\">&lt;&lt;&lt;Sau khi rà soát và sửa kế hoạch&gt;&gt;&gt;<br>Tôi phê duyệt. Hãy tiếp tục.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-top: 2px\">\n      <div style=\"font-size: 18px; letter-spacing: -0.01em; color: #A142F4\">Construction<\u002Fdiv>\n      <div style=\"flex: 1; height: 1px; background: #DADCE0\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #F8F9FA; border: 1px solid #DADCE0; border-radius: 20px; padding: 18px 20px; break-inside: avoid\">\n      <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6368\">Tạo mô hình miền (thành phần)<\u002Fdiv>\n      <div style=\"margin-top: 10px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Vai trò của bạn:<\u002Fb> Bạn là Software Engineer giàu kinh nghiệm. Trước khi bắt đầu nhiệm vụ bên dưới, hãy lập kế hoạch và ghi các bước vào tệp <span style=\"font-weight: 500\">design/component_model.md<\u002Fspan>, có checkbox cho từng bước. Nếu bước nào cần tôi làm rõ, hãy thêm nội dung tương tác vào bước đó để xin xác nhận. Không tự đưa ra quyết định quan trọng. Sau khi tạo kế hoạch, hãy yêu cầu tôi rà soát và phê duyệt. Khi được phê duyệt, hãy thực thi từng bước đúng kế hoạch. Hoàn thành bước nào thì đánh dấu checkbox của bước đó.<\u002Fdiv>\n      <div style=\"margin-top: 8px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Nhiệm vụ:<\u002Fb> Tham khảo user story trong <span style=\"font-weight: 500\">design/seo_optimization_unit.md<\u002Fspan>. Thiết kế mô hình thành phần để hiện thực toàn bộ user story. Mô hình phải chứa tất cả thành phần, thuộc tính, hành vi và cách các thành phần tương tác để hiện thực user story. Chưa sinh mã. Ghi mô hình thành phần vào một tệp md riêng trong thư mục <span style=\"font-weight: 500\">/design<\u002Fspan>.<\u002Fdiv>\n      <div style=\"margin-top: 10px; padding-top: 10px; border-top: 1px solid #DADCE0; font-size: 12px; line-height: 1.62; color: #5F6368\">&lt;&lt;&lt;Sau khi rà soát và sửa kế hoạch&gt;&gt;&gt;<br>Tôi phê duyệt kế hoạch. Hãy tiếp tục. Sau khi hoàn thành mỗi bước, đánh dấu checkbox trong tệp kế hoạch.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #F8F9FA; border: 1px solid #DADCE0; border-radius: 20px; padding: 18px 20px; break-inside: avoid\">\n      <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6368\">Sinh mã<\u002Fdiv>\n      <div style=\"margin-top: 10px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Vai trò của bạn:<\u002Fb> Bạn là Software Engineer giàu kinh nghiệm. Trước khi bắt đầu nhiệm vụ bên dưới, hãy lập kế hoạch và ghi các bước vào một tệp md, có checkbox cho từng bước. Nếu bước nào cần tôi làm rõ, hãy thêm nội dung tương tác vào bước đó để xin xác nhận. Không tự đưa ra quyết định quan trọng. Sau khi tạo kế hoạch, hãy yêu cầu tôi rà soát và phê duyệt. Khi được phê duyệt, bạn có thể tiếp tục thực thi đúng kế hoạch từng bước. Hoàn thành bước nào thì đánh dấu checkbox của bước đó.<\u002Fdiv>\n      <div style=\"margin-top: 8px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Nhiệm vụ:<\u002Fb> Tham khảo thiết kế thành phần trong <span style=\"font-weight: 500\">search_discovery/nlp_component.md<\u002Fspan>. Tạo một implementation Python thật đơn giản và trực quan cho thành phần Natural Language Processing (NLP) trong thiết kế. Với phương thức <span style=\"font-weight: 500\">processQuery(queryText)<\u002Fspan>, dùng API Amazon Bedrock để trích xuất entity từ nội dung truy vấn. Tạo các lớp trong từng tệp riêng nhưng giữ chúng trong thư mục <span style=\"font-weight: 500\">vocabMapper<\u002Fspan>.<\u002Fdiv>\n      <div style=\"margin-top: 8px; font-size: 12px; line-height: 1.62\">Tham khảo mã đã sinh trong thư mục <span style=\"font-weight: 500\">vocabMapper<\u002Fspan>. Tôi muốn thành phần EntityExtractor gọi GenAI. Implementation hiện tại dùng vocabulary_repository cục bộ. Bạn có thể phân tích và lập kế hoạch về cách tận dụng GenAI cho cả Entity Extraction và Intent Extraction không?<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #F8F9FA; border: 1px solid #DADCE0; border-radius: 20px; padding: 18px 20px; break-inside: avoid\">\n      <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6368\">Kiến trúc<\u002Fdiv>\n      <div style=\"margin-top: 10px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Vai trò của bạn:<\u002Fb> Bạn là Cloud Architect giàu kinh nghiệm. Trước khi bắt đầu nhiệm vụ bên dưới, hãy lập kế hoạch và ghi các bước vào <span style=\"font-weight: 500\">deployment_plan.md<\u002Fspan>, có checkbox cho từng bước. Nếu bước nào cần tôi làm rõ, hãy thêm nội dung tương tác vào bước đó để xin xác nhận. Không tự đưa ra quyết định quan trọng. Sau khi tạo kế hoạch, hãy yêu cầu tôi rà soát và phê duyệt. Khi được phê duyệt, hãy thực thi từng bước đúng kế hoạch. Hoàn thành bước nào thì đánh dấu checkbox của bước đó.<\u002Fdiv>\n      <div style=\"margin-top: 8px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Nhiệm vụ:<\u002Fb> Tham khảo mô hình thiết kế thành phần <span style=\"font-weight: 500\">design/core_component_model.md<\u002Fspan>, các Unit trong thư mục <span style=\"font-weight: 500\">UNITS/<\u002Fspan>, kiến trúc cloud trong thư mục <span style=\"font-weight: 500\">ARCHITECTURE/<\u002Fspan> và mã backend trong thư mục <span style=\"font-weight: 500\">BACKEND/<\u002Fspan>. Hoàn thành các nội dung sau:<\u002Fdiv>\n      <div style=\"margin-top: 8px; display: flex; flex-direction: column; gap: 5px; font-size: 12px; line-height: 1.55\">\n        <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">Tạo kế hoạch end-to-end để triển khai backend lên AWS bằng [CloudFormation, CDK, Terraform].<\u002Fdiv>\n        <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">Ghi lại toàn bộ điều kiện tiên quyết cho việc triển khai, nếu có.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top: 8px; font-size: 12px; line-height: 1.62\">Sau khi tôi phê duyệt kế hoạch:<\u002Fdiv>\n      <div style=\"margin-top: 6px; display: flex; flex-direction: column; gap: 5px; font-size: 12px; line-height: 1.55\">\n        <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">Tuân theo thực hành tốt về mã sạch, đơn giản, có thể giải thích.<\u002Fdiv>\n        <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">Toàn bộ mã đầu ra nằm trong thư mục <span style=\"font-weight: 500\">DEPLOYMENT/<\u002Fspan>.<\u002Fdiv>\n        <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">Xác nhận mã đã sinh hoạt động đúng bằng cách tạo kế hoạch xác nhận và báo cáo xác nhận.<\u002Fdiv>\n        <div style=\"border-left: 2px solid #A142F4; padding-left: 12px\">Rà soát báo cáo xác nhận, sửa mọi vấn đề đã xác định và cập nhật báo cáo.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #F8F9FA; border: 1px solid #DADCE0; border-radius: 20px; padding: 18px 20px; break-inside: avoid\">\n      <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6368\">Xây dựng IaC / REST API<\u002Fdiv>\n      <div style=\"margin-top: 10px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Vai trò của bạn:<\u002Fb> Bạn là Software Engineer giàu kinh nghiệm. Trước khi bắt đầu nhiệm vụ bên dưới, hãy lập kế hoạch và ghi các bước vào một tệp md, có checkbox cho từng bước. Nếu bước nào cần tôi làm rõ, hãy thêm nội dung tương tác vào bước đó để xin xác nhận. Không tự đưa ra quyết định quan trọng. Sau khi tạo kế hoạch, hãy yêu cầu tôi rà soát và phê duyệt. Khi được phê duyệt, hãy thực thi từng bước đúng kế hoạch. Hoàn thành bước nào thì đánh dấu checkbox của bước đó.<\u002Fdiv>\n      <div style=\"margin-top: 8px; font-size: 12px; line-height: 1.62\"><b style=\"font-weight: 500\">Nhiệm vụ:<\u002Fb> Tham khảo <span style=\"font-weight: 500\">services.py<\u002Fspan> trong thư mục <span style=\"font-weight: 500\">construction/&lt;&gt;/<\u002Fspan>. Tạo API Python Flask cho từng service trong đó.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Nội dung&quot;},&quot;showAppendix&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Nội dung&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showNotes: this.props.showNotes ?? true,\n      showAppendix: this.props.showAppendix ?? true\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
