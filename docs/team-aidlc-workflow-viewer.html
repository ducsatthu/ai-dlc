    <script>
      const viewport = document.querySelector("#viewport");
      const canvas = document.querySelector("#canvas");
      const diagram = document.querySelector("#diagram");
      const MIN_SCALE = 0.03;
      const MAX_SCALE = 8;
      const state = {
        scale: 1,
        x: 0,
        y: 0,
        dragging: false,
        pointerX: 0,
        pointerY: 0,
      };

      function render() {
        canvas.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
      }

      function zoomAt(nextScale, clientX, clientY) {
        const rect = viewport.getBoundingClientRect();
        const pointX = clientX - rect.left;
        const pointY = clientY - rect.top;
        const contentX = (pointX - state.x) / state.scale;
        const contentY = (pointY - state.y) / state.scale;

        state.scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, nextScale));
        state.x = pointX - contentX * state.scale;
        state.y = pointY - contentY * state.scale;
        render();
      }

      function fitToViewport() {
        const width = diagram.naturalWidth || 8703;
        const height = diagram.naturalHeight || 6369;
        const padding = 24;

        state.scale = Math.max(
          MIN_SCALE,
          Math.min(
            (viewport.clientWidth - padding * 2) / width,
            (viewport.clientHeight - padding * 2) / height,
          ),
        );
        state.x = (viewport.clientWidth - width * state.scale) / 2;
        state.y = (viewport.clientHeight - height * state.scale) / 2;
        render();
      }

      viewport.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();

          if (event.ctrlKey || event.metaKey || event.altKey) {
            const sensitivity = event.ctrlKey ? 0.012 : 0.003;
            zoomAt(
              state.scale * Math.exp(-event.deltaY * sensitivity),
              event.clientX,
              event.clientY,
            );
            return;
          }

          state.x -= event.deltaX;
          state.y -= event.deltaY;
          render();
        },
        { passive: false },
      );

      viewport.addEventListener("dblclick", (event) => {
        zoomAt(state.scale * 1.6, event.clientX, event.clientY);
      });

      viewport.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        state.dragging = true;
        state.pointerX = event.clientX;
        state.pointerY = event.clientY;
        viewport.classList.add("dragging");
        viewport.setPointerCapture(event.pointerId);
      });

      viewport.addEventListener("pointermove", (event) => {
        if (!state.dragging) return;
        state.x += event.clientX - state.pointerX;
        state.y += event.clientY - state.pointerY;
        state.pointerX = event.clientX;
        state.pointerY = event.clientY;
        render();
      });

      function endDrag() {
        state.dragging = false;
        viewport.classList.remove("dragging");
      }

      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);
      diagram.addEventListener("load", fitToViewport);
      window.addEventListener("resize", fitToViewport);
      window.addEventListener("keydown", (event) => {
        const rect = viewport.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        if (event.key === "+" || event.key === "=") {
          zoomAt(state.scale * 1.25, centerX, centerY);
        } else if (event.key === "-") {
          zoomAt(state.scale / 1.25, centerX, centerY);
        } else if (event.key === "0") {
          fitToViewport();
        }
      });

      const svgData = document.querySelector("#svg-data").textContent.replace(/\s/g, "");
      diagram.src = `data:image/svg+xml;base64,${svgData}`;
      fitToViewport();
    </script>
